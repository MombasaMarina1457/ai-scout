<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Scout</title>
<style>
body{font-family:Arial;margin:0;background:#f3f7f4;color:#17321f}header{background:#176b3a;color:white;padding:18px}main{max-width:900px;margin:auto;padding:18px}.card{background:white;padding:18px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}button{background:#176b3a;color:white;border:0;padding:11px 15px;border-radius:8px;margin:4px;cursor:pointer}input,select{display:block;width:100%;padding:11px;margin:7px 0 12px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.hidden{display:none}.badge{display:inline-block;background:#e5f3e9;padding:7px 10px;border-radius:20px;margin:4px}.fail{background:#fdeaea;padding:12px}.ok{background:#e8f7ec;padding:12px}
</style></head><body><header><h1>🧭 AI Scout</h1><span id="who"></span></header><main>
<section id="login"><div class="card"><h2>Welcome to AI Scout</h2><p>Learn Scout skills and take assessments.</p><div class="grid"><div><h3>Create account</h3><input id="rn" placeholder="Scout name"><input id="re" placeholder="Email"><input id="rg" placeholder="Scout group"><select id="rl"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><input id="rp" type="password" placeholder="Password"><button onclick="reg()">Register</button></div><div><h3>Login</h3><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="log()">Login</button></div></div><p>Demo: account data is stored in this browser only.</p></div></section>
<section id="site" class="hidden"><nav><button onclick="page('dash')">Dashboard</button><button onclick="page('learn')">Learn</button><button onclick="page('test')">Assessments</button><button onclick="page('profile')">Profile</button><button onclick="out()">Logout</button></nav><div id="view"></div></section>
</main><script>
const S={Knot_Tying:["Learn the square/reef knot and practise tying it securely.","Which knot joins two ropes of similar size?","What should you do before relying on a knot?","A square/reef knot is mainly used as:"],First_Aid:["Keep the scene safe, get appropriate help and give suitable first aid.","What is the first priority?","What should you do in a serious emergency?","Why use a barrier such as gloves when available?"],Navigation:["Use a map, compass and landmarks to plan and follow a route.","Which tool helps determine direction?","Why plan a route first?","What can landmarks help you do?"],Camping:["Choose a safe site, manage food and water, respect nature and leave no trace.","What should you check before choosing a campsite?","Why store food safely?","What should you do when leaving?"]};
const A={Knot_Tying:["Two similar ropes","Check it is secure","A joining knot"],First_Aid:["Scene safety","Get appropriate emergency help","Reduce exposure to bodily fluids"],Navigation:["Compass","Understand route and risks","Confirm location"],Camping:["Safety and environmental conditions","Reduce risks and attractants","Leave it clean and safe"]};
let U=JSON.parse(localStorage.aiScoutUsers||"{}"), cur=localStorage.aiScoutCurrent||"";
function save(){localStorage.aiScoutUsers=JSON.stringify(U);localStorage.aiScoutCurrent=cur}
function reg(){let e=re.value.trim().toLowerCase();if(!rn.value||!e||!rp.value)return alert("Complete the required fields.");if(U[e])return alert("Email already registered.");U[e]={name:rn.value,email:e,group:rg.value,level:rl.value,pass:rp.value,scores:{},badges:[]};cur=e;save();start()}
function log(){let e=le.value.trim().toLowerCase();if(U[e]&&U[e].pass===lp.value){cur=e;save();start()}else alert("Incorrect email or password.")}
function start(){login.classList.add("hidden");site.classList.remove("hidden");who.textContent="Scout: "+U[cur].name;page("dash")}
function out(){cur="";save();location.reload()}
function page(p){let u=U[cur];if(p==="dash")view.innerHTML="<div class='card'><h2>Welcome, "+u.name+" 👋</h2><p>Group: "+(u.group||"Not set")+" · Level: "+u.level+"</p><h3>Progress</h3><div class='grid'>"+Object.keys(S).map(x=>"<div class='card'><b>"+x.replace("_"," ")+"</b><p>"+(u.scores[x]??"Not assessed")+"% "+(u.badges.includes(x)?"🏅":"")+"</p></div>").join("")+"</div></div>";
if(p==="learn")view.innerHTML="<div class='card'><h2>Learning</h2>"+Object.entries(S).map(([x,v])=>"<div class='card'><h3>"+x.replace("_"," ")+"</h3><p>"+v[0]+"</p></div>").join("")+"</div>";
if(p==="test")view.innerHTML="<div class='card'><h2>Assessments</h2><p>Pass mark: 70%.</p>"+Object.keys(S).map(x=>"<div class='card'><h3>"+x.replace("_"," ")+"</h3><button onclick="quiz('"+x+"')">Start</button></div>").join("")+"</div>";
if(p==="profile")view.innerHTML="<div class='card'><h2>Profile</h2><p>Name: "+u.name+"</p><p>Email: "+u.email+"</p><p>Group: "+(u.group||"Not set")+"</p><p>Level: "+u.level+"</p><h3>Badges</h3>"+(u.badges.length?u.badges.map(x=>"<span class='badge'>🏅 "+x.replace("_"," ")+"</span>").join(""):"None yet")+"</div>"}
function quiz(x){let q=S[x].slice(1),a=A[x];view.innerHTML="<div class='card'><h2>"+x.replace("_"," ")+" Assessment</h2>"+q.map((z,i)=>"<div class='card'><b>"+(i+1)+". "+z+"</b><label><input type='radio' name='q"+i+"' value='1'> "+a[i]+"</label><label><input type='radio' name='q"+i+"' value='0'> Other answer</label></div>").join("")+"<button onclick="submitTest('"+x+"')">Submit</button></div>"}
function submitTest(x){let n=S[x].length-1,score=0;for(let i=0;i<n;i++){let r=document.querySelector("input[name=q"+i+"]:checked");if(r&&r.value==="1")score++}let pct=Math.round(score/n*100),u=U[cur];u.scores[x]=pct;if(pct>=70){if(!u.badges.includes(x))u.badges.push(x);alert("Assessment Approved — "+pct+"%")}else{u.badges=u.badges.filter(b=>b!==x);alert("Assessment Rejected — "+pct+"%. Study the skill and try again.")}save();page("test")}
if(cur&&U[cur])start();
</script></body></html>
